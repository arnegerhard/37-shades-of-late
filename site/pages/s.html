<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Someone's waiting · 37 Shades of Late</title>
<meta name="description" content="Live minutes until the next bus or train at a friend's stop, with an honest opinion about the wait.">
<meta property="og:title" content="Someone's waiting for a bus. Live.">
<meta property="og:description" content="Live minutes until it shows up, and how to feel about it. 37 Shades of Late.">
<!-- The worker (src/worker.ts) points these at the shared stop's own card. -->
<meta property="og:image" content="">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="420">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="">
<!-- Safari's "get the app" bar; with the app installed, the stop link opens it instead. -->
<meta name="apple-itunes-app" content="app-id=6825789256">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23bf1a26'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-weight='900' font-size='52' fill='white' text-anchor='middle'%3E37%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --red: #bf1a26; --night: #0b0d17; --ink: #f4f1ea; --muted: #a8a6b3; --line: rgba(255,255,255,.12);
          --green: #4cd964; --round: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { width: min(520px, 100% - 32px); margin-inline: auto; padding: 28px 0 64px; }
  header { margin-bottom: 36px; }
  .home { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 17px/1 var(--round); }
  .home b { background: var(--red); color: #fff; border-radius: 7px; padding: 5px 8px; font: 900 15px/1 var(--round); }
  .kicker { color: #ff8a93; font: 800 13px/1 var(--round); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 14px; }
  .card { background: #15172c; border: 1px solid var(--line); border-radius: 28px; padding: 26px 24px; }
  .ride { display: flex; align-items: center; gap: 12px; }
  .badge { background: var(--red); color: #fff; border-radius: 9px; padding: 6px 10px; font: 900 22px/1 var(--round); white-space: nowrap; }
  /* New York's subway, Muni Metro, BART and Sound Transit: a circle per line, in its color. */
  .badge.round { border-radius: 999px; padding: 6px; min-width: 22px; text-align: center; }
  .badges { display: flex; gap: 4px; }
  .to { font: 800 21px/1.2 var(--round); }
  .stop { color: var(--muted); margin-top: 4px; }
  .mins { font: 900 clamp(64px, 20vw, 96px)/1 var(--round); letter-spacing: -.03em; margin: 26px 0 4px; color: var(--green); }
  .mins.scheduled { color: var(--muted); }
  .mins small { font-size: .32em; margin-left: 8px; letter-spacing: 0; }
  .later { color: var(--muted); font: 600 17px/1.3 var(--round); }
  .quip { font-style: italic; color: #dcdae3; margin-top: 18px; font-size: 19px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 30px; padding: 13px 20px; border-radius: 14px;
         background: var(--ink); color: #111; text-decoration: none; font: 800 17px/1.1 var(--round); }
  .cta small { display: block; font: 600 11px/1 system-ui; opacity: .7; margin-bottom: 3px; }
  .pitch { color: var(--muted); margin-top: 26px; }
  .pitch a { color: #ff8a93; }
  /* The live map: the route, the stop and the buses on their way, like the app's. */
  .map { height: 340px; margin-top: 16px; border-radius: 28px; overflow: hidden; border: 1px solid var(--line); background: #15172c; }
  .map[hidden] { display: none; }
  .bus { width: 46px; height: 46px; border-radius: 50%; background: #1c1c1e; border: 3px solid var(--red); box-sizing: border-box;
         display: grid; place-items: center; color: #fff; font: 900 16px/1 var(--round); }
  .bus.live { color: var(--green); }
  .here { width: 22px; height: 22px; border-radius: 50%; background: #0a84ff; border: 3px solid #fff; box-sizing: border-box; }
</style>
</head>
<body>
<div class="wrap">
<header><a class="home" href="/"><b>37</b>37 Shades of Late</a></header>
<main>
  <div class="kicker">A friend is waiting here</div>
  <div class="card" aria-live="polite">
    <div class="ride"><span class="badges" id="badges"><span class="badge">…</span></span><div><div class="to" id="to">Asking nicely…</div><div class="stop" id="stop">&nbsp;</div></div></div>
    <div class="mins" id="mins">–</div>
    <div class="later" id="later">&nbsp;</div>
    <div class="quip" id="quip">&nbsp;</div>
  </div>
  <div class="map" id="map" aria-label="Map of the buses on their way" hidden></div>
  <a class="cta" id="cta" href="https://apps.apple.com/app/id6825789256">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.9-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.5-1-2.5-3.8zM14.2 5.8c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg>
    <span><small>Get it on your Lock Screen</small>37 Shades of Late</span>
  </a>
  <p class="pitch">Minutes until your bus or train, right on your Lock Screen, in San Francisco, Seattle, New York and Boston.
    Already have the app? This link opens this stop in it. <a href="/">What is this?</a></p>
</main>
</div>
<script>
  // /s?c=sf&l=37&s=13254&d=IB — city, line, stop and direction, as the app shares them. Lines combined
  // with it come as lists (l=K,L,M&d=IB,IB,IB, and a stop per line when one is a short walk away),
  // as the proxy's departures take them; the first one is the line the stop and direction are for.
  const API = "https://bus37-proxy.arne-5c1.workers.dev/v1/";
  const params = new URLSearchParams(location.search);
  const city = params.get("c") || "sf", lines = params.get("l") || "37", stops = params.get("s") || "13254", ways = params.get("d") || "";
  const ids = lines.split(","), line = ids[0], stop = stops.split(",")[0], way = ways.split(",")[0];
  const combined = ids.length > 1;
  // "K, L or M" in sentences (the badges are below).
  const spoken = combined ? ids.slice(0, -1).join(", ") + " or " + ids[ids.length - 1] : line;
  const base = API + (city === "sf" ? "" : city + "/");
  const $ = (id) => document.getElementById(id);
  // As the app's (Selection.badgeParts): lines with badges of their own come in their colors, those
  // sharing one next to each other. Round for New York's subway (one letter or number, and
  // the S shuttles; its buses all have more), Muni's J, K, L, M, N, T, E and F, and Sound Transit's
  // 1, 2, T, N and S Lines (a "1" in its circle) and BART's (a "Y" for Yellow); a rectangle for
  // Seattle's RapidRide, in its dark red. Any others with them share a red rectangle.
  const COLORS = {
    nyc: { 1: "#D82233", 2: "#D82233", 3: "#D82233", 4: "#009952", 5: "#009952", 6: "#009952", 7: "#9A38A1",
           A: "#0062CF", C: "#0062CF", E: "#0062CF", B: "#EB6800", D: "#EB6800", F: "#EB6800", M: "#EB6800",
           G: "#799534", J: "#8E5C33", Z: "#8E5C33", L: "#7C858C", N: "#F6BC26", Q: "#F6BC26", R: "#F6BC26", W: "#F6BC26" },
    sf: { J: "#A96614", K: "#437C93", L: "#942D83", M: "#008547", N: "#005B95", T: "#BF2B45", F: "#B49A36", E: "#666666",
          Red: "#FF0000", Orange: "#FF9933", Yellow: "#FFFF33", Green: "#339933", Blue: "#0099CC", OAK: "#B0BEC7" },
    seattle: { "1 Line": "#28813F", "2 Line": "#007CAD", "T Line": "#F38B00", "N Line": "#9AB6D3", "S Line": "#9AB6D3",
               ...Object.fromEntries("ABCDEFGH".split("").map((l) => [`${l} Line`, "#9C182F"])) },
  };
  // BART's lines by their colors, as the app's (LineBadge.short): a "Y" for Yellow.
  const BART = { Red: "R", Orange: "O", Yellow: "Y", Green: "G", Blue: "B", OAK: "OAK" };
  // Boston's subway, as the app's (LineBadge.bostonSubway): what its circles say, in its colors.
  const BOSTON = { Red: ["RL", "#DA291C"], Orange: ["OL", "#ED8B00"], Blue: ["BL", "#003DA5"], Mattapan: ["M", "#DA291C"],
                   B: ["B", "#00843D"], C: ["C", "#00843D"], D: ["D", "#00843D"], E: ["E", "#00843D"] };
  const DARK_TEXT = ["#F6BC26", "#B49A36", "#F38B00", "#9AB6D3", "#FF9933", "#FFFF33", "#B0BEC7", "#FFC72C"];
  const roundLine = (id) => city === "nyc" ? id.length === 1 || id.startsWith("S ")
    : city === "sf" ? /^[EFJKLMNT]$/.test(id) || id in BART : city === "seattle" ? /^[12TNS] Line$/.test(id)
    : city === "boston" && id in BOSTON;
  const colorOf = (id) => city === "boston"
    ? (BOSTON[id] || [])[1] || (id.startsWith("SL") ? "#7C878E" : /^(\d|CT)/.test(id) ? "#FFC72C" : undefined)
    : (COLORS[city] || {})[id] || (city === "nyc" && id.startsWith("S ") ? "#7C858C" : undefined);
  const groups = [];
  for (const id of ids.some(colorOf) ? ids : []) {
    const color = colorOf(id), round = roundLine(id);
    const group = groups.find((g) => g.color === color && g.round === round);
    if (group) group.ids.push(id); else groups.push({ color, round, ids: [id] });
  }
  // A circle per line, those sharing a color next to each other (the A, C and E in three blue circles).
  const parts = groups.flatMap((g) => (g.round ? g.ids.map((id) => ({ ...g, ids: [id] })) : [g]));
  $("badges").replaceChildren(...(parts.length ? parts : [{ ids }]).map((group) => {
    const span = document.createElement("span");
    span.className = group.round ? "badge round" : "badge";
    // As the app's (LineBadge.short): Red, Orange and Blue are lines in both San Francisco and Boston.
    const labels = group.round ? group.ids.map((id) => city === "sf" ? BART[id] || id
      : city === "boston" ? (BOSTON[id] || [])[0] || id : id.replace(/ Line$/, "")) : group.ids;
    span.textContent = labels.join(labels.every((id) => id.length === 1) ? "" : "·");
    if (group.color) {
      span.style.background = group.color;
      if (DARK_TEXT.includes(group.color)) span.style.color = "#000";
    }
    return span;
  }));

  function quip(minutes, which) {
    if (minutes < 4) return `Holy shit, the ${which} is real.`;
    if (minutes < 9) return "Stay put, lazy bastard.";
    if (minutes < 16) return "Make coffee. Reconsider your life.";
    return "Walking is starting to look attractive.";
  }

  // Where the line goes from this stop, once; and each line's route there, for the map.
  const stopList = stops.split(","), wayList = ways.split(",");
  let stopAt, routes = [], upcoming = [];
  const routesLoaded = Promise.all(ids.map((id, i) =>
    fetch(base + "lines/" + encodeURIComponent(id) + "?client=web").then((r) => r.json()).then((data) => {
      const at = stopList[i] || stop;
      const direction = data.directions?.find((d) => d.id === (wayList[i] ?? way) && d.stops.some((s) => s.code === at))
        ?? data.directions?.find((d) => d.stops.some((s) => s.code === at));
      if (!direction) return;
      routes.push(direction.shapes?.length ? direction.shapes : [direction.stops.filter((s) => s.lat).map((s) => [s.lat, s.lon])]);
      if (i > 0) return;
      $("to").textContent = "To " + direction.destination;
      const here = direction.stops.find((s) => s.code === stop);
      if (here?.lat) stopAt = here;
      if (here?.name) { $("stop").textContent = here.name; document.title = `The ${spoken} at ${here.name} · 37 Shades of Late`; }
    }).catch(() => {})));

  // The live map (Apple's MapKit JS, signed in through /mapkit-token): the routes, the stop, and the
  // next buses with their minutes, moved at every refresh. It starts on the stop, and the first time
  // there are buses, shows them and the stop; after that it stays where the reader puts it.
  let map, busMarks = [], framed = false;
  window.initMap = async () => {
    mapkit.init({ authorizationCallback: (done) => fetch("/mapkit-token").then((r) => r.text()).then(done) });
    mapkit.addEventListener("error", () => { $("map").hidden = true; });
    await routesLoaded;
    if (!stopAt) return;
    $("map").hidden = false;
    map = new mapkit.Map("map", {
      colorScheme: mapkit.Map.ColorSchemes.Dark,
      mapType: mapkit.Map.MapTypes.MutedStandard,
      pointOfInterestFilter: mapkit.PointOfInterestFilter.excludingAllCategories,
      showsCompass: mapkit.FeatureVisibility.Hidden,
      showsMapTypeControl: false,
      showsZoomControl: false,
      isRotationEnabled: false,
    });
    const style = new mapkit.Style({ strokeColor: "#bf1a26", lineWidth: 5, lineCap: "round", lineJoin: "round" });
    for (const shapes of routes) for (const shape of shapes) {
      map.addOverlay(new mapkit.PolylineOverlay(shape.map(([lat, lon]) => new mapkit.Coordinate(lat, lon)), { style }));
    }
    map.addAnnotation(new mapkit.Annotation(new mapkit.Coordinate(stopAt.lat, stopAt.lon), () => {
      const dot = document.createElement("div");
      dot.className = "here";
      return dot;
    }, { title: stopAt.name, anchorOffset: new DOMPoint(0, 0) }));
    showBuses();
  };

  function showBuses() {
    if (!map) return;
    map.removeAnnotations(busMarks);
    const minutes = (d) => Math.max(0, Math.floor((Date.parse(d.time) - Date.now()) / 60_000));
    busMarks = upcoming.filter((d) => d.vehicle).slice(0, 3).map((d) => new mapkit.Annotation(
      new mapkit.Coordinate(d.vehicle.lat, d.vehicle.lon), () => {
        const mark = document.createElement("div");
        mark.className = "bus" + (d.live ? " live" : "");
        mark.textContent = (combined ? d.line + " " : "") + (minutes(d) === 0 ? "now" : minutes(d));
        return mark;
      }, { anchorOffset: new DOMPoint(0, 0) }));
    map.addAnnotations(busMarks);
    if (framed) return;
    // The stop and the buses with room around them, a few blocks across at least.
    framed = busMarks.length > 0;
    const points = [stopAt, ...busMarks.map((b) => ({ lat: b.coordinate.latitude, lon: b.coordinate.longitude }))];
    const lats = points.map((p) => p.lat), lons = points.map((p) => p.lon);
    const span = (values, least) => Math.max(least, (Math.max(...values) - Math.min(...values)) * 1.5);
    map.setRegionAnimated(new mapkit.CoordinateRegion(
      new mapkit.Coordinate((Math.min(...lats) + Math.max(...lats)) / 2, (Math.min(...lons) + Math.max(...lons)) / 2),
      new mapkit.CoordinateSpan(span(lats, 0.01), span(lons, 0.012))), framed);
  }

  async function refresh() {
    let next = 60_000;
    try {
      const query = new URLSearchParams({ stop: stops, line: lines, direction: ways, client: "web" });
      const response = await fetch(base + "departures?" + query, { cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      const data = await response.json();
      if (data.stop?.name && $("stop").textContent.trim() === "") $("stop").textContent = data.stop.name;
      upcoming = data.departures.filter((d) => Date.parse(d.time) > Date.now() - 30_000);
      showBuses();
      const minutes = (d) => Math.max(0, Math.floor((Date.parse(d.time) - Date.now()) / 60_000));
      if (upcoming.length) {
        const first = minutes(upcoming[0]);
        $("mins").innerHTML = first === 0 ? "now" : `${first}<small>min</small>`;
        $("mins").classList.toggle("scheduled", !upcoming[0].live);
        const later = upcoming.slice(1, 3);
        // Combined lines say which one each time is for: "the K, then L 9 · M 14 min".
        const then = later.map((d) => (combined ? `${d.line} ` : "") + minutes(d)).join(" · ");
        $("later").textContent = (combined ? `the ${upcoming[0].line}` : "") + (combined && later.length ? ", " : "")
          + (later.length ? `then ${then} min` : "");
        $("quip").textContent = `“${quip(first, upcoming[0].line || line)}”`;
      } else {
        $("mins").textContent = "??";
        $("later").textContent = "";
        $("quip").textContent = `“Schrödinger's ${spoken}: both coming and not coming.”`;
      }
      if (data.nextRefreshAt) next = Math.max(10_000, Date.parse(data.nextRefreshAt) - Date.now() + 1_000);
    } catch {
      $("mins").textContent = "404";
      $("quip").textContent = `“The ${spoken} ${combined ? "have" : "has"} entered the witness protection program.”`;
    }
    setTimeout(refresh, next);
  }
  refresh();
</script>
<script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.core.js" crossorigin async
        data-callback="initMap" data-libraries="map,annotations,overlays"></script>
</body>
</html>
